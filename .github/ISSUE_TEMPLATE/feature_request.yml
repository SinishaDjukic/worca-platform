name: Feature request
description: Suggest something the platform could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like the platform to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use now, or other ways to solve it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Console
        - Sign-in and access
        - Instances and the gate
        - Compute or edge providers
        - Deploying (create-platform, setup, upgrade)
        - Branding and optional modules
        - Other
