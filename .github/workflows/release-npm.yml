name: Release @worca/platform or @worca/create-platform to npm

# Tag-driven release, copied from worca-cc's release-npm-app.yml and changed only for two packages,
# each on its own release line with its own tag prefix (docs/RELEASING.md). One workflow file serves
# both, so both packages' npm trusted publishers name it. The git tag is the trigger AND the source
# of truth for the package, the published version and the dist-tag:
#
#   worca-platform-v1.0.0                -> @worca/platform 1.0.0, dist-tag `latest`
#   worca-platform-v1.0.0-rc.1           -> @worca/platform 1.0.0-rc.1, dist-tag `rc`
#   worca-create-platform-v1.0.0-rc.1    -> @worca/create-platform 1.0.0-rc.1, dist-tag `rc`
on:
  push:
    tags:
      - "worca-platform-v*"
      - "worca-create-platform-v*"

permissions:
  contents: read

jobs:
  # Nothing publishes unless every test passes on the tagged commit, on .nvmrc's Node like every
  # dev CI job (the floor and the newest LTS are caught by ci.yml's matrix).
  test:
    name: check, unit, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          set -euo pipefail
          npm run keys:dev
          npm run check
          npm test
          npm run test:package

  stack:
    name: ${{ matrix.suite }} against the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            fast: "1"
            run: npm run test:e2e
          - suite: ui
            fast: ""
            run: npm run test:ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: matrix.suite == 'ui'
        run: npx playwright install --with-deps chromium

      - name: Start the local stack
        env:
          E2E_FAST: ${{ matrix.fast }}
        run: |
          set -euo pipefail
          npm run keys:dev
          nohup npm run dev > dev-stack.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "ready. Ctrl-C" dev-stack.log; then exit 0; fi
            sleep 2
          done
          cat dev-stack.log
          echo "::error::the local stack did not start"
          exit 1

      - name: Run ${{ matrix.suite }}
        env:
          E2E_FAST: ${{ matrix.fast }}
        run: ${{ matrix.run }}

  build-and-publish:
    needs: [test, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1, which ships bundled with Node >= 24.5.
      # Rely on the bundled npm rather than `npm install -g npm@latest`. Fail loudly if it's too old.
      - name: Verify npm supports Trusted Publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          node -e 'const [a,b,c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} is < 11.5.1 (required for Trusted Publishing)`); process.exit(1); }' "$NPM_VERSION"

      # The tag names the package; its version must be that package's package.json version.
      - name: Resolve the package and validate the version
        id: pkg
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG_NAME" in
            worca-create-platform-v*) DIR=create-platform ;;
            worca-platform-v*) DIR=platform ;;
            *) echo "::error::unexpected tag $TAG_NAME"; exit 1 ;;
          esac
          TAG_VERSION="${TAG_NAME#worca-$DIR-v}"
          PKG_VERSION=$(node -p "require('./packages/$DIR/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) must equal @worca/$DIR's package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Determine npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if echo "$VERSION" | grep -q -- '-rc\.'; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `npm publish` builds dist/ and copies LICENSE, NOTICE and THIRD_PARTY_NOTICES.md in via
      # `prepack`; this step does it once up front and checks the packed file lists, so a wrong list
      # fails here, before anything is published.
      - name: Build and check the packed file list
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          set -euo pipefail
          (cd "packages/$DIR" && npm run prepack --if-present && npm pack --dry-run --json --ignore-scripts > "../../pack.json")
          node -e '
            const p = process.env.DIR;
            const bad = /(^|\/)(test|tests|\.dev\.vars|\.wrangler|\.secrets[^/]*\.env|deployments)(\/|$)/;
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const hit = files.filter((f) => bad.test(f));
            if (hit.length) { console.error(`@worca/${p}: must not ship ${hit.join(", ")}`); process.exit(1); }
            for (const need of ["package.json", "README.md", "LICENSE"]) if (!files.includes(need)) { console.error(`@worca/${p}: ${need} missing`); process.exit(1); }
            console.log(`@worca/${p}: ${files.length} files`);'

      # A create-platform release must scaffold deployments that install: its platform range has to
      # match a published @worca/platform.
      - name: Check the scaffolded @worca/platform range resolves
        if: steps.pkg.outputs.dir == 'create-platform'
        run: |
          set -euo pipefail
          RANGE=$(node -p "require('./packages/create-platform/package.json').worca?.platformRange ?? '^' + require('./packages/create-platform/package.json').version")
          FOUND=$(npm view "@worca/platform@$RANGE" version --json 2>/dev/null || true)
          if [ -z "$FOUND" ]; then
            echo "::error::@worca/platform@$RANGE matches no published version; release @worca/platform first"
            exit 1
          fi
          echo "@worca/platform@$RANGE -> $FOUND"

      # Auth is via OIDC Trusted Publishing (no NPM_TOKEN in this repo). --provenance makes the
      # requirement explicit.
      - name: Publish to npm
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd "packages/$DIR" && npm publish --access public --provenance --tag "$DIST_TAG"

  release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notes are GitHub's generated notes alone, counted from the previous STABLE release (an
      # RC's too): left to itself GitHub starts at the newest release of any kind.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREFIX="${TAG_NAME%%-v[0-9]*}"   # worca-platform or worca-create-platform
          VERSION="${TAG_NAME#$PREFIX-v}"
          PRERELEASE=""
          if echo "$VERSION" | grep -q -- '-rc\.'; then
            PRERELEASE="--prerelease"
          fi
          # The highest stable tag below this version's X.Y.Z (1.1.0 and 1.1.0-rc.4 both → 1.0.2).
          CORE="${VERSION%%-*}"
          PREV="$(git ls-remote --tags --refs origin "$PREFIX-v*" | sed 's#.*refs/tags/##' \
            | { grep -E "^$PREFIX-v[0-9]+\.[0-9]+\.[0-9]+\$" || true; echo "$PREFIX-v$CORE"; } \
            | sort -uV | grep -B1 -x "$PREFIX-v$CORE" | head -1)"
          START=()
          if [ "$PREV" != "$PREFIX-v$CORE" ]; then START=(--notes-start-tag "$PREV"); fi
          echo "Release notes since: ${START[1]:-the first release (no earlier stable tag)}"
          gh release create "$TAG_NAME" \
            --title "@worca/${PREFIX#worca-} $VERSION" \
            --generate-notes \
            ${START[@]+"${START[@]}"} \
            $PRERELEASE
